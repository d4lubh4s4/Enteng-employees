<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Payroll</title>
<style>
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    input[type="number"] { width: 80px; }
    select { width: 100px; }
    tfoot td { font-weight: bold; }
    .highest-paid { background-color: #ffff99; } /* Highlight color for highest paid */
</style>
</head>
<body>

<h2>Employee Payroll</h2>

<button onclick="addEmployee()">Add Employee</button>
<button onclick="downloadCSV()">Download Payroll</button>

<table id="payrollTable">
    <thead>
        <tr>
            <th>Employee Name</th>
            <th>Designation</th>
            <th>Days Worked (1st half)</th>
            <th>Days Worked (2nd half)</th>
            <th>Daily Rate (₱)</th>
            <th>Incentives (₱)</th>
            <th>Total Pay (₱)</th>
        </tr>
    </thead>
    <tbody>
        <!-- Employees will be added here -->
    </tbody>
    <tfoot>
        <tr>
            <td colspan="6">Grand Total</td>
            <td id="grandTotal">₱0.00</td>
        </tr>
    </tfoot>
</table>

<script>
function addEmployee() {
    const tbody = document.querySelector("#payrollTable tbody");
    const row = document.createElement("tr");

    // Employee name
    const nameCell = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "Enter name";
    nameCell.appendChild(nameInput);
    row.appendChild(nameCell);

    // Designation dropdown
    const designationCell = document.createElement("td");
    const designationSelect = document.createElement("select");
    ["Baker", "Cashier"].forEach(opt => {
        const optionEl = document.createElement("option");
        optionEl.value = opt;
        optionEl.textContent = opt;
        designationSelect.appendChild(optionEl);
    });
    designationCell.appendChild(designationSelect);
    row.appendChild(designationCell);

    // Days worked 1st half
    const days1Cell = document.createElement("td");
    const days1Input = document.createElement("input");
    days1Input.type = "number";
    days1Input.min = 0;
    days1Input.value = 0;
    days1Cell.appendChild(days1Input);
    row.appendChild(days1Cell);

    // Days worked 2nd half
    const days2Cell = document.createElement("td");
    const days2Input = document.createElement("input");
    days2Input.type = "number";
    days2Input.min = 0;
    days2Input.value = 0;
    days2Cell.appendChild(days2Input);
    row.appendChild(days2Cell);

    // Daily rate
    const rateCell = document.createElement("td");
    const rateInput = document.createElement("input");
    rateInput.type = "number";
    rateInput.min = 0;
    rateInput.value = 0;
    rateCell.appendChild(rateInput);
    row.appendChild(rateCell);

    // Incentives
    const incentivesCell = document.createElement("td");
    const incentivesInput = document.createElement("input");
    incentivesInput.type = "number";
    incentivesInput.min = 0;
    incentivesInput.value = 0;
    incentivesCell.appendChild(incentivesInput);
    row.appendChild(incentivesCell);

    // Total pay
    const totalCell = document.createElement("td");
    totalCell.textContent = "₱0.00";
    row.appendChild(totalCell);

    function updateTotal() {
        const total = (Number(days1Input.value) + Number(days2Input.value)) * Number(rateInput.value) + Number(incentivesInput.value);
        totalCell.textContent = `₱${total.toFixed(2)}`;
        updateGrandTotal();
        highlightHighestPaid();
    }

    [days1Input, days2Input, rateInput, incentivesInput].forEach(input => {
        input.addEventListener("input", updateTotal);
    });

    tbody.appendChild(row);
    updateTotal();
}

function updateGrandTotal() {
    const totalCells = document.querySelectorAll("#payrollTable tbody tr td:last-child");
    let grandTotal = 0;
    totalCells.forEach(cell => {
        const value = parseFloat(cell.textContent.replace("₱", "")) || 0;
        grandTotal += value;
    });
    document.getElementById("grandTotal").textContent = `₱${grandTotal.toFixed(2)}`;
}

function highlightHighestPaid() {
    const rows = document.querySelectorAll("#payrollTable tbody tr");
    let max = 0;
    let highestRow = null;

    rows.forEach(row => {
        row.classList.remove("highest-paid");
        const totalCell = row.querySelector("td:last-child");
        const value = parseFloat(totalCell.textContent.replace("₱", "")) || 0;
        if (value > max) {
            max = value;
            highestRow = row;
        }
    });

    if (highestRow) {
        highestRow.classList.add("highest-paid");
    }
}

// CSV Download function
function downloadCSV() {
    let csv = [];
    const rows = document.querySelectorAll("#payrollTable tr");
    rows.forEach(row => {
        const cols = row.querySelectorAll("td, th");
        let rowData = [];
        cols.forEach(col => {
            let text = col.textContent.replace("₱", "").trim();
            rowData.push(text);
        });
        csv.push(rowData.join(","));
    });

    const csvString = csv.join("\n");
    const blob = new Blob([csvString], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Payroll.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
