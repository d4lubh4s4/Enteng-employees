<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enteng Cheesedesal Payroll System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}

.container{
    max-width:500px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:12px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#d35400;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#b84300;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginCard">
<h2>Admin Login</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- PAYROLL SYSTEM -->
<div class="card hidden" id="payrollCard">
<h2>Enteng Cheesedesal Payroll</h2>

<label>Month</label>
<input type="text" id="month">

<label>Employee Name</label>
<select id="employee">
<option>Roby</option>
<option>Andrea</option>
<option>Anthony</option>
<option>Bryan</option>
<option>Bojo</option>
</select>

<label>Role</label>
<select id="role">
<option>Cashier</option>
<option>Baker</option>
</select>

<label>Daily Rate</label>
<input type="number" id="rate">

<label>Days Worked</label>
<input type="number" id="days">

<label>Overtime / Incentives</label>
<input type="number" id="ot" value="0">

<button onclick="generatePDF()">Generate Payslip PDF</button>

</div>

</div>

<script>
function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user==="admin" && pass==="Enteng2026!"){
        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("payrollCard").classList.remove("hidden");
    } else {
        alert("Invalid login.");
    }
}

function peso(num){
    return "₱ " + Number(num).toLocaleString("en-PH",{minimumFractionDigits:2});
}

// Simplified PH deductions
function computeSSS(salary){
    return salary * 0.045; 
}

function computePhilhealth(salary){
    return salary * 0.02; 
}

function computePagibig(salary){
    return salary * 0.02; 
}

async function generatePDF(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

let month = document.getElementById("month").value;
let name = document.getElementById("employee").value;
let role = document.getElementById("role").value;
let rate = Number(document.getElementById("rate").value);
let days = Number(document.getElementById("days").value);
let ot = Number(document.getElementById("ot").value);

let basic = rate * days;

let sss = computeSSS(basic);
let philhealth = computePhilhealth(basic);
let pagibig = computePagibig(basic);

let totalDeduction = sss + philhealth + pagibig;
let totalEarnings = basic + ot;
let netPay = totalEarnings - totalDeduction;

let today = new Date().toLocaleDateString("en-PH");

// LOGO
let logo = new Image();
logo.src = "enteng_cheese-logo only.png";

logo.onload = function(){

doc.addImage(logo, "PNG", 10, 10, 30, 30);

doc.setFontSize(16);
doc.text("Enteng Cheesedesal (Solano Branch)", 50, 20);

doc.setFontSize(11);
doc.text("Month: " + month, 14, 50);
doc.text("Employee Name: " + name, 14, 57);
doc.text("Role: " + role, 14, 64);
doc.text("Rate: " + peso(rate), 14, 71);
doc.text("Pay Date: " + today, 14, 78);

doc.line(10, 85, 200, 85);

doc.setFontSize(13);
doc.text("EARNINGS", 14, 95);

doc.setFontSize(11);
doc.text("Basic Salary", 14, 105);
doc.text(peso(basic), 150, 105);

doc.text("Overtime / Incentives", 14, 112);
doc.text(peso(ot), 150, 112);

doc.text("Total Earnings", 14, 120);
doc.text(peso(totalEarnings), 150, 120);

doc.line(10, 125, 200, 125);

doc.setFontSize(13);
doc.text("DEDUCTIONS", 14, 135);

doc.setFontSize(11);
doc.text("SSS", 14, 145);
doc.text(peso(sss), 150, 145);

doc.text("Pag-IBIG", 14, 152);
doc.text(peso(pagibig), 150, 152);

doc.text("PhilHealth", 14, 159);
doc.text(peso(philhealth), 150, 159);

doc.text("Total Deductions", 14, 167);
doc.text(peso(totalDeduction), 150, 167);

doc.line(10, 172, 200, 172);

doc.setFontSize(14);
doc.text("NET PAY: " + peso(netPay), 14, 182);

doc.save(name + "_Payslip.pdf");

};

}
</script>

</body>
</html>
