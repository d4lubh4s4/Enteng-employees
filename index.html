<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enteng Cheesedesal Payroll</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}
.container{
    padding:15px;
}
.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
input{
    width:100%;
    padding:6px;
    margin:4px 0;
}
button{
    padding:8px;
    background:#d35400;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{background:#b84300;}
.hidden{display:none;}
h2{text-align:center;}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginCard">
<h2>Admin Login</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="payrollSection" class="hidden">

<h2>Enteng Cheesedesal (Solano Branch)</h2>

<div id="employees"></div>

</div>
</div>

<script>
const employees = [
    {name:"Roby", role:"Cashier", rate:500},
    {name:"Andrea", role:"Cashier", rate:500},
    {name:"Anthony", role:"Baker", rate:600},
    {name:"Bryan", role:"Baker", rate:600},
    {name:"Bojo", role:"Cashier", rate:500}
];

function login(){
    if(username.value==="admin" && password.value==="Enteng2026!"){
        loginCard.classList.add("hidden");
        payrollSection.classList.remove("hidden");
        renderEmployees();
    } else {
        alert("Invalid login");
    }
}

function peso(num){
    return "₱ " + Number(num).toLocaleString("en-PH",{minimumFractionDigits:2});
}

function computeSSS(salary){ return salary * 0.045; }
function computePhilhealth(salary){ return salary * 0.02; }
function computePagibig(salary){ return salary * 0.02; }

function renderEmployees(){
    const container = document.getElementById("employees");
    container.innerHTML = "";

    employees.forEach((emp,index)=>{

        container.innerHTML += `
        <div class="card">
            <h3>${emp.name} (${emp.role})</h3>
            <label>Days Worked</label>
            <input type="number" id="days${index}" value="0">

            <label>Overtime</label>
            <input type="number" id="ot${index}" value="0">

            <button onclick="generatePDF(${index})">
                Generate Payslip PDF
            </button>
        </div>
        `;
    });
}

async function generatePDF(index){

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let emp = employees[index];
    let days = Number(document.getElementById("days"+index).value);
    let ot = Number(document.getElementById("ot"+index).value);

    let basic = emp.rate * days;
    let sss = computeSSS(basic);
    let philhealth = computePhilhealth(basic);
    let pagibig = computePagibig(basic);

    let totalDeduction = sss + philhealth + pagibig;
    let totalEarnings = basic + ot;
    let netPay = totalEarnings - totalDeduction;

    let today = new Date().toLocaleDateString("en-PH");

    const response = await fetch("enteng_cheese-logo only.png");
    const blob = await response.blob();
    const reader = new FileReader();

    reader.onloadend = function(){
        const logo = reader.result;

        doc.addImage(logo,"PNG",10,10,30,30);
        doc.setFontSize(16);
        doc.text("Enteng Cheesedesal (Solano Branch)",50,20);

        doc.setFontSize(11);
        doc.text("Employee: " + emp.name,14,50);
        doc.text("Role: " + emp.role,14,57);
        doc.text("Rate: " + peso(emp.rate),14,64);
        doc.text("Pay Date: " + today,14,71);

        doc.line(10,78,200,78);

        doc.text("Basic Salary",14,90);
        doc.text(peso(basic),150,90);

        doc.text("Overtime",14,97);
        doc.text(peso(ot),150,97);

        doc.text("Total Earnings",14,105);
        doc.text(peso(totalEarnings),150,105);

        doc.line(10,110,200,110);

        doc.text("SSS",14,120);
        doc.text(peso(sss),150,120);

        doc.text("Pag-IBIG",14,127);
        doc.text(peso(pagibig),150,127);

        doc.text("PhilHealth",14,134);
        doc.text(peso(philhealth),150,134);

        doc.text("Total Deductions",14,142);
        doc.text(peso(totalDeduction),150,142);

        doc.line(10,150,200,150);

        doc.setFontSize(13);
        doc.text("NET PAY: " + peso(netPay),14,162);

        doc.save(emp.name+"_Payslip.pdf");
    };

    reader.readAsDataURL(blob);
}
</script>

</body>
</html>
